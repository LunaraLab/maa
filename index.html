<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1a0b05">
<title>For Maa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3e6cb;--ink:#3b1a10;--kum:#b3201f;--hal:#e9a825;--mari:#e8821c;--teak:#2a160c;--cream:#fbf1dc;
--serif:'Lora','Noto Serif','Georgia',serif;--deva:'Tiro Devanagari Hindi','Noto Serif Devanagari','Lora',serif;--hand:'Kalam','Noto Sans Devanagari',cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0b05;font-family:var(--serif);color:var(--cream);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:#1a0b05}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .9s ease,visibility 0s .9s;overflow:hidden}
.scene.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .9s ease}
.bgfx{position:absolute;inset:0;z-index:0;pointer-events:none}
.in{position:absolute;inset:0;z-index:2;padding:56px 22px 100px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.in.scroll{overflow-y:auto;scrollbar-width:none}.in.scroll::-webkit-scrollbar{display:none}
.in.nonext{padding-bottom:24px}
.paper{background:var(--paper);color:var(--ink)}
.paper::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:multiply;opacity:.6;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .22 0'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E")}
.paper::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(120,60,20,.28) 100%)}

/* type */
.kick{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.8;text-align:center}
.paper .kick{color:var(--kum);opacity:1}
.ttl{font-family:var(--deva);font-weight:400;font-size:clamp(30px,9vw,40px);line-height:1.2;margin:6px 0 2px;text-align:center}
.ttl.sm{font-size:clamp(24px,7vw,31px)}
.sub{font-style:italic;font-size:17px;opacity:.85;text-align:center;margin:0;white-space:pre-line;line-height:1.4}
.hint{font-size:14px;letter-spacing:.1em;opacity:.7;font-style:italic;text-align:center;white-space:pre-line;animation:pulse 2.8s ease-in-out infinite;margin:6px 0 0}
@keyframes pulse0{}
.hint.gone{animation:none;opacity:0;transition:opacity .6s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
.cap{font-size:19px;line-height:1.5;text-align:center;font-style:italic;white-space:pre-line;margin:0;opacity:0;transform:translateY(8px);transition:opacity .9s,transform .9s}
.cap.in2{opacity:1;transform:none}
.ornament{width:120px;height:14px;margin:10px auto 0;opacity:.7;background:radial-gradient(circle,currentColor 0 2px,transparent 3px) center/14px 14px repeat-x}

/* next */
.next-wrap{position:absolute;left:0;right:0;bottom:30px;z-index:5;display:flex;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s}
.next-wrap.show{opacity:1;pointer-events:auto}
.next{font-family:var(--deva);font-size:19px;padding:11px 32px;border-radius:40px;border:1px solid currentColor;background:rgba(255,255,255,.06);color:inherit;letter-spacing:.04em}
.paper .next{background:rgba(179,32,31,.06);color:var(--kum)}

/* generic slider */
.trk{position:relative;width:min(calc(100% - 46px),300px);height:54px;margin:8px 0 2px;touch-action:none;cursor:grab;flex:none}
.trk-line{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:rgba(255,255,255,.25)}
.trk-fill{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:var(--hal);width:0}
.knob{position:absolute;top:50%;left:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e9a825);box-shadow:0 0 20px rgba(255,190,70,.6);display:flex;align-items:center;justify-content:center;color:#4a2410}
.knob svg{width:24px;height:24px}

/* polaroid */
.pola{position:relative;background:#fffaf0;padding:9px 9px 30px;box-shadow:0 12px 28px rgba(40,15,5,.45);transform:rotate(-3deg);margin:0}
.pola img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:linear-gradient(135deg,#d9b27a,#a35a2a)}
.pola figcaption{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--hand);font-size:17px;color:#3b1a10;line-height:1.4}
.pola::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;margin-left:-35px;background:rgba(240,220,170,.7);transform:rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ambience */
#petals{position:fixed;inset:0;max-width:520px;margin:0 auto;z-index:20;pointer-events:none;overflow:hidden;opacity:.55;transition:opacity 1s}
.petal{position:absolute;top:-30px;border-radius:70% 0 70% 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-40px,0) rotate(0)}100%{transform:translate3d(var(--dx),110vh,0) rotate(540deg)}}
body[data-s=phone] #petals,body[data-s=night] #petals,body[data-s=letter] #petals{opacity:0}
#toran{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;z-index:30;display:flex;justify-content:center;gap:9px;pointer-events:none}
#toran i{width:8px;height:8px;border-radius:50%;background:rgba(150,130,110,.4);transition:background .8s,transform .8s,box-shadow .8s}
#toran i.on{background:var(--hal);box-shadow:0 0 8px rgba(233,168,37,.7)}
#toran i.cur{transform:scale(1.5);background:var(--mari)}
#snd{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:calc(50% - min(50vw,260px) + 10px);z-index:31;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,230,190,.35);background:rgba(30,12,6,.45);color:#ffe6bd;display:flex;align-items:center;justify-content:center;padding:0}
#snd svg{width:18px;height:18px}
#snd .x{display:none}#snd.mute .x{display:block}
.spark{position:absolute;pointer-events:none;z-index:40}

/* 1 diya */
.s-diya{background:radial-gradient(120% 80% at 50% 56%,#3a1a0c 0%,#1a0b05 55%,#0d0502 100%);color:#fbe7c4}
.dy-stage{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dy-glow{position:absolute;left:50%;top:50%;width:140vw;height:140vw;max-width:700px;max-height:700px;border-radius:50%;transform:translate(-50%,-52%) scale(.15);opacity:0;background:radial-gradient(circle,rgba(255,190,90,.5) 0%,rgba(255,150,50,.2) 30%,rgba(255,120,30,0) 62%);transition:transform 2.6s cubic-bezier(.2,.7,.2,1),opacity 2s;pointer-events:none}
.s-diya.lit .dy-glow{transform:translate(-50%,-52%) scale(1);opacity:1}
#diya{position:relative;width:min(66vw,260px);height:auto;overflow:visible}
.flame{transform-origin:100px 66px;transform:scale(0);transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)}
.s-diya.lit .flame{transform:scale(1);animation:flick 2.4s ease-in-out 1.2s infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.96,1.07) skewX(-2deg)}60%{transform:scale(1.04,.96) skewX(2deg)}}
.dy-txt{text-align:center;min-height:178px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.dy-after{opacity:0;transition:opacity 1.8s 1.1s}
.s-diya.lit .dy-after{opacity:1}
.dy-pre{transition:opacity .8s}.s-diya.lit .dy-pre{opacity:0}
.dy-txt .ttl{font-size:clamp(58px,17vw,78px);margin:0;color:#ffd98a;text-shadow:0 0 30px rgba(255,170,60,.5)}

/* 2 carrying */
.s-carry{background:radial-gradient(120% 90% at 50% 38%,#a82a22 0%,#6b1512 55%,#2f0807 100%);color:#fbe7c4}
.cr-stage{position:relative;width:min(62vw,240px);aspect-ratio:1;margin:12px auto 6px;touch-action:none;flex:none}
.cr-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,214,150,.6);opacity:0;pointer-events:none}
.cr-ring.go{animation:ripple 1.3s ease-out}
@keyframes ripple{0%{transform:scale(.62);opacity:.9}100%{transform:scale(1.28);opacity:0}}
.cr-core{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffcf8a,#e8821c 55%,#b3201f);box-shadow:0 0 50px rgba(255,150,60,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .14s;touch-action:none;cursor:pointer;color:#4a1208}
.cr-core.beat{transform:scale(1.08)}
.cr-core b{font-family:var(--deva);font-weight:400;font-size:62px;line-height:1}
.cr-core small{font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-top:2px}
.cr-dots{display:flex;gap:7px;justify-content:center;margin:4px 0 10px}
.cr-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,220,170,.25);transition:background .5s}
.cr-dots i.on{background:#ffd98a}
.cr-cap{min-height:96px;display:flex;align-items:flex-start;justify-content:center}
.cr-photo{position:absolute;left:50%;top:50%;width:84%;transform:translate(-50%,-50%) rotate(-3deg) scale(.9);opacity:0;transition:opacity 1.6s,transform 1.6s;pointer-events:none;z-index:5}
.cr-photo.show{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
.s-carry.fin .cr-core,.s-carry.fin .cr-ring{opacity:0;transition:opacity 1s}
.cr-sub{opacity:0;transition:opacity 1.4s;font-size:15px;margin-top:8px}.cr-sub.show{opacity:.8}

/* 3 roti */
#plates{position:relative;width:min(100%,360px);height:calc(var(--P) + 34px);margin-top:20px;flex:none;--P:min(41vw,162px)}
.plate{position:absolute;top:0;width:var(--P);height:var(--P);border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6f6f4 0%,#cfd1d2 40%,#8f9498 72%,#c8cacb 100%);box-shadow:0 10px 20px rgba(60,30,10,.4),inset 0 0 0 6px rgba(255,255,255,.28),inset 0 0 0 8px rgba(0,0,0,.14)}
#plA{left:0}#plB{right:0}
.pl-lab{position:absolute;top:calc(var(--P) + 8px);width:var(--P);text-align:center;font-family:var(--deva);font-size:18px}
.roti{position:absolute;border-radius:50%;z-index:5;background:radial-gradient(circle at 40% 35%,#f3d08e 0%,#e2b062 55%,#c58a3a 100%);box-shadow:inset -4px -5px 10px rgba(120,60,10,.35),0 3px 6px rgba(0,0,0,.35);transition:left 1s cubic-bezier(.5,0,.2,1),top 1s cubic-bezier(.5,0,.2,1);cursor:pointer}
.roti::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 40%,rgba(110,50,10,.55) 0 3px,transparent 4px),radial-gradient(circle at 62% 30%,rgba(110,50,10,.5) 0 4px,transparent 5px),radial-gradient(circle at 55% 66%,rgba(110,50,10,.55) 0 3px,transparent 4px),radial-gradient(circle at 25% 68%,rgba(110,50,10,.45) 0 2px,transparent 3px),radial-gradient(circle at 76% 58%,rgba(110,50,10,.5) 0 3px,transparent 4px)}
.rt-caps{width:100%;margin-top:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.rt-caps .cap{font-size:20px}
.rt-a2{font-size:17px!important;opacity:.0}.rt-a2.in2{opacity:.85}

/* 4 night */
.s-night{background:linear-gradient(180deg,#070b24 0%,#151a45 55%,#2a2150 100%);color:#f3e6cb}
.nt-dawn{background:linear-gradient(180deg,#3a2a5a 0%,#c0583d 62%,#f4b05a 100%);opacity:0}
.nt-stars{background-image:radial-gradient(1.5px 1.5px at 12% 14%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 18%,#fff,transparent),radial-gradient(1px 1px at 61% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 16%,#fff,transparent),radial-gradient(1px 1px at 90% 7%,#fff,transparent),radial-gradient(1px 1px at 8% 36%,#fff,transparent),radial-gradient(1.5px 1.5px at 93% 33%,#fff,transparent)}
.nt-time{font-family:var(--deva);font-size:38px;margin:8px 0 6px;letter-spacing:.04em;color:#ffd98a}
.nt-photo{height:clamp(110px,19vh,180px);aspect-ratio:4/3;border:6px solid #fff4dc;border-bottom-width:6px;box-shadow:0 10px 26px rgba(0,0,0,.5);overflow:hidden;flex:none;background:#533}
.nt-photo img{width:100%;height:100%;object-fit:cover;display:block}
.nt-cap{margin-top:14px;min-height:84px;display:flex;align-items:flex-start;justify-content:center}

/* 5 then/now */
.tn-box{--x:50%;position:relative;height:min(42vh,350px);aspect-ratio:4/5;margin:14px 0 10px;border:7px solid #fffaf0;box-shadow:0 12px 26px rgba(50,20,5,.4);overflow:hidden;touch-action:none;cursor:ew-resize;flex:none;background:#a35a2a;z-index:3}
.tn-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.tn-then{clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.tn-then img{filter:sepia(.55) contrast(1.05)}
.tn-div{position:absolute;top:0;bottom:0;left:var(--x);width:3px;margin-left:-1.5px;background:#fffaf0;box-shadow:0 0 8px rgba(0,0,0,.4)}
.tn-div b{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fffaf0;color:var(--kum);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.tn-chip{position:absolute;bottom:8px;padding:3px 10px;background:rgba(40,15,5,.7);color:#ffe9c4;font-size:13px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.tn-chip.l{left:8px}.tn-chip.r{right:8px}
.tn-caps{position:relative;width:100%;min-height:70px;z-index:3}
.tn-caps .cap{position:absolute;left:0;right:0;top:0;font-size:18px}

/* 6 trunk */
.s-trunk{background:radial-gradient(120% 90% at 50% 70%,#4a2a14 0%,#2a160c 60%,#150a05 100%);color:#f6dfb8}
.tk-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px;margin-top:14px;flex:none}
.tk-card{border:1px solid rgba(240,200,130,.4);background:rgba(255,240,210,.07);border-radius:10px;padding:10px 8px;text-align:center;font-size:15px;line-height:1.3;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#f6dfb8;transition:background .3s}
.tk-card svg{width:30px;height:30px}
.tk-card:active{background:rgba(255,240,210,.16)}
#tkSvg{width:min(58vw,220px);height:auto;margin-top:10px;flex:none;overflow:visible}
.tk-lid-c{opacity:0;transition:opacity .9s}.s-trunk.shut .tk-lid-c{opacity:1}
.tk-lid-o{opacity:1;transition:opacity .9s}.s-trunk.shut .tk-lid-o{opacity:0}
.tk-cap{margin-top:8px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%}
.tk-cap .cap{font-size:18px}

/* 7 phone */
.s-phone{background:linear-gradient(180deg,#101114,#060607);color:#f2f2f2}
.ph-pane{position:absolute;inset:0;padding:56px 22px 100px;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transition:opacity .6s}
.ph-pane.on{opacity:1;pointer-events:auto}
.ph-list{width:100%;max-width:340px;margin-top:16px;display:flex;flex-direction:column}
.ph-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.1);opacity:0;transform:translateX(-10px);transition:opacity .7s,transform .7s}
.ph-row.in2{opacity:1;transform:none}
.ph-row svg{width:20px;height:20px;color:#ff5a5a;flex:none}
.ph-row b{font-weight:500;font-size:19px;color:#ff7a7a}
.ph-row span{margin-left:auto;font-size:14px;opacity:.6}
.ph-row small{display:block;font-size:13px;opacity:.55;margin-top:2px}
.ph-note{margin-top:18px;opacity:0;transition:opacity 1.4s}.ph-note.in2{opacity:1;transform:none}
.ph-av{width:132px;height:132px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#d9b27a,#a35a2a);box-shadow:0 0 0 6px rgba(255,255,255,.08)}
.ph-ring{align-items:center;justify-content:space-between;padding-top:90px}
.ph-ring .av{position:relative;margin-top:20px}
.ph-ring .av::before,.ph-ring .av::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.4);animation:ripple 1.8s ease-out infinite}
.ph-ring .av::after{animation-delay:.9s}
.ph-name{font-family:var(--deva);font-size:40px;margin:16px 0 0;text-align:center}
.ph-lbl{opacity:.65;font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.ph-btns{display:flex;gap:64px;margin-bottom:10px}
.ph-btn{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;background:none;border:0;color:#ddd}
.ph-btn i{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ph-btn.no i{background:#e0342f}.ph-btn.yes i{background:#2fb44f;animation:wob 1.2s infinite}
.ph-btn svg{width:30px;height:30px;color:#fff}
@keyframes wob{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.ph-decl{height:22px;opacity:0;transition:opacity .5s;font-style:italic;color:#ffb3a8}.ph-decl.in2{opacity:1}
.ph-call{padding-top:50px}
.ph-call .ph-av{width:76px;height:76px}
.ph-call .ph-name{font-size:30px;margin-top:8px}
#phTimer{font-size:16px;opacity:.7;letter-spacing:.08em;margin-top:2px}
.ph-chat{width:100%;max-width:340px;margin-top:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}
.ph-chat::-webkit-scrollbar{display:none}
.bub{align-self:flex-start;max-width:88%;background:rgba(255,255,255,.1);padding:10px 14px;border-radius:16px 16px 16px 4px;font-size:17px;line-height:1.45;font-style:italic;opacity:0;transform:translateY(8px);transition:opacity .7s,transform .7s}
.bub.in2{opacity:1;transform:none}
.ph-after{margin-top:10px;text-align:center;white-space:pre-line;font-size:19px;font-style:italic;opacity:0;transition:opacity 1.4s;line-height:1.5}.ph-after.in2{opacity:1}

/* 8 door */
.s-door{background:linear-gradient(180deg,#f6b25a 0%,#d9683a 45%,#7a2a2f 100%);color:#fff1da}
.dr-night{background:linear-gradient(180deg,#141233 0%,#3a1d3c 55%,#6a2a2a 100%);opacity:0}
.dr-stage{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;margin-top:6px}
.dr-world{height:100%;max-height:340px;transform-origin:50% 92%;transition:transform .12s linear;will-change:transform}
.dr-world svg{height:100%;width:auto;display:block}
.dr-cap{margin-top:8px;min-height:84px;display:flex;align-items:center;justify-content:center;width:100%}
.dr-cap .cap{font-size:19px}
.wave{transform-origin:140px 152px;animation:wave 1.3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}

/* 9 bill */
.bl-card{position:relative;z-index:3;width:100%;max-width:340px;margin-top:12px;background:#fbf3df;border:1px solid #c9a97a;box-shadow:0 10px 24px rgba(60,25,8,.3);padding:12px 14px 12px 22px;background-image:linear-gradient(90deg,transparent 15px,rgba(190,40,40,.5) 15px,rgba(190,40,40,.5) 16px,transparent 16px),repeating-linear-gradient(180deg,transparent 0 31px,rgba(70,100,160,.22) 31px 32px);flex:none}
.bl-head{font-family:var(--hand);font-size:17px;border-bottom:2px solid rgba(60,30,10,.5);padding-bottom:4px;margin-bottom:2px}
.bl-row{display:flex;gap:10px;align-items:baseline;font-family:var(--hand);font-size:17px;line-height:1.35;padding:3px 0;opacity:0;transform:translateX(-8px);transition:opacity .7s,transform .7s}
.bl-row.in2{opacity:1;transform:none}
.bl-row span{flex:1}
.bl-row em{font-style:normal;white-space:nowrap}
.bl-tot{border-top:2px solid rgba(60,30,10,.6);margin-top:6px;padding-top:6px;font-weight:600}
.bl-pay{margin-top:14px;position:relative;z-index:3;flex:none;padding:12px 26px;border-radius:40px;border:1.5px solid var(--kum);background:var(--kum);color:#fff1da;font-size:17px;opacity:0;pointer-events:none;transition:opacity 1s,transform .2s}
.bl-pay.show{opacity:1;pointer-events:auto}
.bl-stamp{position:absolute;z-index:6;left:50%;top:44%;width:min(80%,300px);transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0;border:5px double var(--kum);color:var(--kum);padding:10px 8px;text-align:center;border-radius:8px;background:rgba(251,243,223,.82);pointer-events:none}
.bl-stamp b{display:block;font-family:var(--deva);font-weight:400;font-size:34px;line-height:1.2}
.bl-stamp small{font-size:15px;letter-spacing:.3em;text-transform:uppercase}
.bl-stamp.slam{animation:slam .5s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(3)}60%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(.94)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.bl-after{margin-top:14px;position:relative;z-index:3;font-size:19px;opacity:0;transition:opacity 1.6s;flex:none}.bl-after.in2{opacity:1;transform:none}

/* 10 letter */
.s-letter{background:radial-gradient(120% 90% at 50% 30%,#2b3558 0%,#141b33 70%,#0a0e1c 100%);color:#e7eef6}
.lt-fold{margin-top:40px;width:min(82vw,330px);aspect-ratio:1.5;background:linear-gradient(135deg,#dbe8f2,#bdd1e3);color:#1d3557;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 26px;gap:2px;cursor:pointer;position:relative;font-family:var(--hand);font-size:24px;transform:rotate(-2deg);transition:transform .9s,opacity .9s}
.lt-fold::before{content:"";position:absolute;inset:8px;border:2px dashed rgba(200,50,50,.5);border-radius:2px;border-image:repeating-linear-gradient(45deg,#d44 0 10px,#fff 10px 20px,#26a 20px 30px,#fff 30px 40px) 8}
.lt-fold span{position:relative}
.s-letter.open .lt-fold{opacity:0;transform:rotate(-2deg) scale(.7);pointer-events:none;position:absolute}
.lt-paper{display:none;position:relative;width:100%;max-width:350px;margin-top:6px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:24px 22px 28px 26px;background:#dce8f2;color:#1b2f4d;box-shadow:0 18px 40px rgba(0,0,0,.5);background-image:repeating-linear-gradient(180deg,transparent 0 33px,rgba(60,90,140,.25) 33px 34px);font-family:var(--hand);font-size:20px;line-height:34px;-webkit-user-select:none}
.lt-paper::-webkit-scrollbar{display:none}
.s-letter.open .lt-paper{display:block;animation:unfold 1s ease-out}
@keyframes unfold{0%{opacity:0;transform:scaleY(.1)}100%{opacity:1;transform:scaleY(1)}}
.lt-paper p{margin:0 0 14px}
.lt-paper .w{opacity:0;filter:blur(6px);transition:opacity .9s,filter .9s;display:inline-block;margin-right:.28em}
.lt-paper p.on .w{opacity:1;filter:none}
.lt-sign{white-space:pre-line;text-align:right;opacity:0;transition:opacity 1.6s;margin-top:6px}.lt-sign.in2{opacity:1}
.lt-hint{margin-top:18px}
.s-letter:not(.open) .kick{opacity:0}

/* 11 end */
.s-end{background:radial-gradient(120% 80% at 50% 22%,#ffe39a 0%,#f4a93a 48%,#c2561c 100%);color:var(--ink)}
.en-pola{width:min(44vw,180px);margin:16px 0 12px;flex:none;position:relative;z-index:3}
.feet{width:min(46vw,170px);height:auto;cursor:pointer;margin-top:4px;flex:none;position:relative;z-index:3;transition:filter 1.2s;overflow:visible}
.s-end.blessed .feet{filter:drop-shadow(0 0 16px rgba(255,236,160,.95));cursor:default}
.s-end.blessed .hint{opacity:0;animation:none}
.en-bless{font-family:var(--deva);font-size:clamp(26px,7.4vw,32px);line-height:1.3;text-align:center;white-space:pre-line;margin:10px 0 0;opacity:0;transition:opacity 1.6s;color:#8e1715}
.en-line{text-align:center;white-space:pre-line;font-size:18px;line-height:1.5;margin:10px 0 0;font-style:italic;opacity:0;transition:opacity 1.6s}
.en-bless.in2,.en-line.in2{opacity:1}
.en-btns{display:flex;gap:10px;margin-top:16px;opacity:0;pointer-events:none;transition:opacity 1.4s;flex-wrap:wrap;justify-content:center}
.en-btns.in2{opacity:1;pointer-events:auto}
.en-btn{padding:11px 22px;border-radius:40px;border:1.5px solid #8e1715;background:#8e1715;color:#fff1da;font-size:17px;text-decoration:none;font-family:var(--serif)}
.en-btn.alt{background:transparent;color:#8e1715}
.en-replay{margin-top:14px;background:none;border:0;color:var(--ink);opacity:.0;font-size:15px;font-style:italic;text-decoration:underline;transition:opacity 1.4s;padding:6px}.en-replay.in2{opacity:.7}
@media (max-height:700px){.in{padding-top:50px}.ttl{font-size:clamp(26px,8vw,34px)}.sub{font-size:15px}.cap{font-size:17px}.cr-cap{min-height:78px}.dy-txt{min-height:150px}}
</style>

<script>
(function(){
'use strict';
const $=(s,c)=>(c||document).querySelector(s);
const $$=(s,c)=>Array.from((c||document).querySelectorAll(s));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rnd=(a,b)=>a+Math.random()*(b-a);
const T=ms=>ms*(CONFIG.timeScale||1);
const haptic=p=>{try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}};
const rotisN=()=>Math.round((CONFIG.childAge||25)*365*2).toLocaleString('en-IN');
const fill=s=>String(s==null?'':s).replace(/\{mom\}/g,CONFIG.mom).replace(/\{me\}/g,CONFIG.myName).replace(/\{rotis\}/g,rotisN());
const set=(sel,txt)=>{const e=$(sel);if(e)e.textContent=fill(txt);};
const photo=(k,w,h)=>{const p=CONFIG.photos[k]||{};return p.src?p.src:'https://picsum.photos/seed/'+encodeURIComponent(p.seed||k)+'/'+w+'/'+h;};
const setImg=(sel,k,w,h)=>{const e=$(sel);if(e)e.src=photo(k,w||600,h||600);};
const show=(el,delay)=>setTimeout(()=>el&&el.classList.add('in2'),delay||0);
const later=(fn,ms)=>setTimeout(fn,T(ms));
function reveal(el,txt){el.classList.remove('in2');el.textContent=fill(txt);void el.offsetWidth;el.classList.add('in2');}

/* ---------- sound (generated, no files) ---------- */
const Sound=(function(){
  let ctx=null,master=null,droneG=null,droneTimer=null,droneOn=false,step=0,ringTimer=null;
  function ensure(){
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
      try{ctx=new AC();master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);}catch(e){ctx=null;return null;}}
    if(ctx.state==='suspended')ctx.resume();return ctx;
  }
  function nbuf(len,fn){const b=ctx.createBuffer(1,ctx.sampleRate*len,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=fn();return b;}
  const NOTES=[196,261.63,261.63,130.81];
  function pluck(){
    const c=ensure();if(!c||!droneG)return;const t=c.currentTime,f=NOTES[step%4];step++;
    [0,4].forEach(d=>{
      const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=d;
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(1800,t);lp.frequency.exponentialRampToValueAtTime(420,t+3);
      const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+4.2);
      o.connect(lp);lp.connect(g);g.connect(droneG);o.start(t);o.stop(t+4.3);
    });
  }
  function bellTone(f,vol,dur){
    const c=ensure();if(!c)return;const t=c.currentTime;
    [[1,1],[2.76,.5],[5.4,.28],[8.93,.12]].forEach(p=>{
      const o=c.createOscillator();o.type='sine';o.frequency.value=f*p[0];
      const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol*p[1],t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur/p[0]**.4);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1);
    });
  }
  return {
    drone(on){
      const c=ensure();if(!c)return false;
      if(on===undefined)on=!droneOn;
      if(on&&!droneOn){droneG=c.createGain();droneG.gain.value=1;droneG.connect(master);pluck();droneTimer=setInterval(pluck,1250);}
      if(!on&&droneOn){clearInterval(droneTimer);const g=droneG;if(g){g.gain.setTargetAtTime(0,c.currentTime,.4);}droneG=null;}
      droneOn=on;return on;
    },
    isOn:()=>droneOn,
    bell(){bellTone(523.25,.09,4.5);},
    tick(){bellTone(1318,.03,.5);},
    thump(v){
      const c=ensure();if(!c)return;const t=c.currentTime;
      const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(78,t);o.frequency.exponentialRampToValueAtTime(40,t+.2);
      const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.26);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+.28);
    },
    stamp(){
      const c=ensure();if(!c)return;this.thump(.3);const t=c.currentTime;
      const s=c.createBufferSource();s.buffer=nbuf(.2,()=>Math.random()*2-1);
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
      const g=c.createGain();g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      s.connect(lp);lp.connect(g);g.connect(master);s.start(t);s.stop(t+.2);
    },
    rustle(){
      const c=ensure();if(!c)return;const t=c.currentTime;
      const s=c.createBufferSource();s.buffer=nbuf(.7,()=>Math.random()*2-1);
      const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3500;bp.Q.value=.6;
      const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06,t+.12);g.gain.linearRampToValueAtTime(.02,t+.35);g.gain.exponentialRampToValueAtTime(.0001,t+.7);
      s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+.72);
    },
    ring(on){
      const c=ensure();
      if(!on){if(ringTimer){clearInterval(ringTimer);ringTimer=null;}return;}
      if(!c||ringTimer)return;
      const one=()=>{const t=c.currentTime;[0,.5].forEach(off=>{[440,480].forEach(f=>{
        const o=c.createOscillator();o.type='sine';o.frequency.value=f;const g=c.createGain();
        g.gain.setValueAtTime(.0001,t+off);g.gain.linearRampToValueAtTime(.05,t+off+.02);g.gain.setValueAtTime(.05,t+off+.38);g.gain.linearRampToValueAtTime(.0001,t+off+.42);
        o.connect(g);g.connect(master);o.start(t+off);o.stop(t+off+.45);});});};
      one();ringTimer=setInterval(one,2600);
    }
  };
})();

/* ---------- helpers ---------- */
function drag(el,onMove,onStart,onEnd){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}
    onStart&&onStart(e);
    const mv=ev=>onMove(ev);
    const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);onEnd&&onEnd(ev);};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    onMove(e);
  });
}
function slider(trk,knob,fillEl,cb){
  let p=0;
  function setP(v){p=clamp(v,0,1);knob.style.left=(p*100)+'%';if(fillEl)fillEl.style.width=(p*100)+'%';cb(p);}
  drag(trk,e=>{const r=trk.getBoundingClientRect();setP((e.clientX-r.left)/r.width);});
  return {set:setP,get:()=>p};
}
function burst(box,n,glyph,colors,cx,cy){
  const r=box.getBoundingClientRect();
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='spark';s.textContent=glyph;
    s.style.left=(cx!=null?cx:r.width/2)+'px';s.style.top=(cy!=null?cy:r.height/2)+'px';
    s.style.fontSize=rnd(12,24)+'px';s.style.color=colors[i%colors.length];box.appendChild(s);
    const a=rnd(0,Math.PI*2),d=rnd(70,190);
    if(s.animate)s.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+40)+'px) scale(1.2) rotate('+rnd(-200,200)+'deg)',opacity:0}],{duration:rnd(1200,2200),easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
    setTimeout(()=>s.remove(),2400);
  }
}

/* ---------- scene manager ---------- */
const ORDER=['diya','carrying','roti','night','then','trunk','phone','door','bill','letter','end'];
const INIT={},LEAVE={},inited={};let cur=-1;
const toran=$('#toran');ORDER.forEach(()=>toran.appendChild(document.createElement('i')));
function go(id){
  const idx=ORDER.indexOf(id);if(idx<0)return;
  const prev=ORDER[cur];if(prev&&prev!==id&&LEAVE[prev])LEAVE[prev]();
  $$('.scene').forEach(s=>s.classList.remove('active'));

  $$('i',toran).forEach((b,i)=>{b.classList.toggle('on',i<idx);b.classList.toggle('cur',i===idx);});
  if(!inited[id]){inited[id]=true;if(INIT[id])INIT[id]();}
}

/* ===== 2 CARRYING ===== */
INIT.carrying=function(){
  const C=CONFIG.carrying,sc=$('#scene-carrying'),core=$('#crCore'),ring=$('#crRing'),num=$('#crNum'),cap=$('#crCap'),stage=$('#crStage');
  set('#crKick',C.kicker);set('#crTtl',C.title);set('#crSub',C.sub);set('#crHint',C.hint);set('#crWord',C.monthWord);
  const ph=CONFIG.photos.carrying;setImg('#crPhoto img','carrying',500,500);$('#crPhoto figcaption').textContent=fill(ph.cap||'');
  const dots=$('#crDots');for(let i=0;i<9;i++)dots.appendChild(document.createElement('i'));
  const di=$$('i',dots);
  let prog=0,holding=false,done=false,last=0,lastBeat=0,shown=0,raf=0;
  function setMonth(m){num.textContent=m;reveal(cap,C.months[m-1]);di.forEach((d,i)=>d.classList.toggle('on',i<m));}
  function beat(){
    core.classList.add('beat');setTimeout(()=>core.classList.remove('beat'),150);
    ring.classList.remove('go');void ring.offsetWidth;ring.classList.add('go');
    Sound.thump(.14);haptic([24,70,14]);setTimeout(()=>Sound.thump(.08),180);
  }
  function finish(){
    done=true;holding=false;sc.classList.add('fin');$('#crPhoto').classList.add('show');
    reveal(cap,C.done);$('#crDone').textContent=fill(C.doneSub);show($('#crDone'),1500);$('#crDone').classList.add('show');
    $('#crHint').classList.add('gone');Sound.bell();haptic([40,60,40]);
    later(()=>cont('carrying'),2600);
  }
  function loop(ts){
    if(!holding||done)return;
    const dt=Math.min(64,ts-last);last=ts;prog+=dt/T(1700);
    const m=Math.min(9,Math.floor(prog)+1);if(m!==shown){shown=m;setMonth(m);}
    const iv=T(980-Math.min(8,prog)*48);if(ts-lastBeat>iv){lastBeat=ts;beat();}
    if(prog>=9){finish();return;}
    raf=requestAnimationFrame(loop);
  }
  function stop(){holding=false;cancelAnimationFrame(raf);}
  stage.addEventListener('pointerdown',e=>{
    if(done)return;e.preventDefault();try{stage.setPointerCapture(e.pointerId);}catch(_){}
    holding=true;last=performance.now();lastBeat=0;$('#crHint').classList.add('gone');raf=requestAnimationFrame(loop);
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>stage.addEventListener(ev,stop));
  stage.addEventListener('contextmenu',e=>e.preventDefault());
};

  const offA=[[-7,-6],[3,0],[9,7]],offB=[[0,0],[-5,-6],[5,4],[-3,6]];
  function place(el,pl,o){el.style.left=(pl.offsetLeft+(P-rs)/2+o[0])+'px';el.style.top=(pl.offsetTop+(P-rs)/2+o[1])+'px';}
  function mk(){const e=document.createElement('div');e.className='roti';e.style.width=e.style.height=rs+'px';e.style.transform='rotate('+Math.round(rnd(0,360))+'deg)';box.appendChild(e);return e;}
  const A=[],B=[];
  for(let i=0;i<3;i++){const e=mk();place(e,pa,offA[i]);e.style.zIndex=5+i;A.push(e);}
  {const e=mk();place(e,pb,offB[0]);B.push(e);}
  let n=0;
  function serve(){
    if(!A.length)return;const e=A.pop(),k=B.length;
    place(e,pb,offB[k]);e.style.zIndex=10+k;B.push(e);Sound.tick();haptic(14);
    reveal($('#rtCap'),R.lines[n]);n++;$('#rtHint').classList.add('gone');
    if(!A.length){
      later(()=>reveal($('#rtA1'),R.after1),2600);
      later(()=>reveal($('#rtA2'),R.after2),5600);
      later(()=>cont('roti'),8200);
    }
  }
  A.forEach(e=>e.addEventListener('click',serve));pa.addEventListener('click',serve);
};

/* ===== 4 NIGHT ===== */
INIT.night=function(){
  const N=CONFIG.night,ev=N.events;
  set('#ntKick',N.kicker);set('#ntTtl',N.title);set('#ntSub',N.sub);set('#ntHint',N.hint);setImg('#ntPhoto img','baby',500,380);
  const dawn=$('#ntDawn'),stars=$('#ntStars'),time=$('#ntTime'),cap=$('#ntCap'),img=$('#ntPhoto');
  let last=-1,reached=false;
  const sl=slider($('#ntTrack'),$('#ntKnob'),$('#ntFill'),p=>{
    dawn.style.opacity=p;stars.style.opacity=1-p;img.style.filter='brightness('+(.5+.5*p)+') saturate(.8)';
    const i=Math.min(ev.length-1,Math.floor(p*ev.length));
    if(i!==last){last=i;time.textContent=ev[i].t;reveal(cap,ev[i].text);if(p>0){Sound.tick();haptic(8);}}
    if(p>.98&&!reached){reached=true;Sound.bell();cont('night');}
  });
  sl.set(0);
};

/* ===== 5 THEN / NOW ===== */
INIT.then=function(){
  const H=CONFIG.then;
  set('#tnKick',H.kicker);set('#tnTtl',H.title);set('#tnSub',H.sub);set('#tnHint',H.hint);set('#tnL',H.thenLabel);set('#tnR',H.nowLabel);
  setImg('#tnThen','then',500,625);setImg('#tnNow','now',500,625);
  const box=$('#tnBox'),ct=$('#tnCapT'),cn=$('#tnCapN'),hint=$('#tnHint');
  ct.textContent=fill(H.thenText);cn.textContent=fill(H.nowText);
  let sT=false,sN=false,done=false;
  function setX(x){
    x=clamp(x,0,100);box.style.setProperty('--x',x+'%');
    ct.classList.toggle('in2',x>=56);cn.classList.toggle('in2',x<=44);hint.classList.toggle('gone',x>=56||x<=44);
    if(x>=80)sT=true;if(x<=20)sN=true;
    if(sT&&sN&&!done){done=true;Sound.bell();cont('then');}
  }
  drag(box,e=>{const r=box.getBoundingClientRect();setX((e.clientX-r.left)/r.width*100);},()=>haptic(8));
  setX(50);
};

/* ===== 6 TRUNK ===== */
const ICONS={
  bangle:'<svg viewBox="0 0 32 32" fill="none" stroke="#f2c25a" stroke-width="2.4"><circle cx="12" cy="17" r="8"/><circle cx="20" cy="17" r="8"/></svg>',
  scroll:'<svg viewBox="0 0 32 32" fill="none" stroke="#f2c25a" stroke-width="2.2" stroke-linecap="round"><rect x="6" y="5" width="20" height="22" rx="2"/><path d="M10 11h12M10 16h12M10 21h7"/></svg>',
  note:'<svg viewBox="0 0 32 32" fill="none" stroke="#f2c25a" stroke-width="2.4" stroke-linecap="round"><path d="M12 24V8l14-3v16"/><circle cx="9" cy="24" r="3.5"/><circle cx="23" cy="21" r="3.5"/></svg>',
  saree:'<svg viewBox="0 0 32 32" fill="none" stroke="#f2c25a" stroke-width="2.2" stroke-linecap="round"><path d="M6 6h20l-2 21H8z"/><path d="M6 11h20M7 22h18"/></svg>'
};
INIT.trunk=function(){
  const K=CONFIG.trunk,sc=$('#scene-trunk');
  set('#tkKick',K.kicker);set('#tkTtl',K.title);set('#tkSub',K.sub);set('#tkHint',K.hint);
  const box=$('#tkCards'),cap=$('#tkCap');let count=0;
  K.items.forEach(it=>{
    const c=document.createElement('button');c.className='tk-card';c.innerHTML=(ICONS[it.icon]||ICONS.note)+'<span></span>';
    $('span',c).textContent=fill(it.title);box.appendChild(c);
    c.addEventListener('click',()=>{
      if(c.dataset.done)return;c.dataset.done=1;$('#tkHint').classList.add('gone');
      const cr=c.getBoundingClientRect(),tr=$('#tkMouth').getBoundingClientRect();
      const dx=tr.left+tr.width/2-(cr.left+cr.width/2),dy=tr.top+tr.height/2-(cr.top+cr.height/2);
      c.style.pointerEvents='none';
      c.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx*.5+'px,'+(dy*.3-26)+'px) scale(.8) rotate(-6deg)',opacity:1,offset:.45},{transform:'translate('+dx+'px,'+dy+'px) scale(.15)',opacity:0}],{duration:1100,easing:'ease-in',fill:'forwards'});
      reveal(cap,it.text);Sound.tick();haptic(14);count++;
      if(count===K.items.length){
        later(()=>{sc.classList.add('shut');Sound.thump(.2);haptic(40);},1700);
        later(()=>{reveal(cap,K.closing);},3200);
        later(()=>{const s=document.createElement('p');s.className='sub';s.style.marginTop='6px';s.textContent=fill(K.closingSub);s.style.opacity=0;s.style.transition='opacity 1.6s';cap.parentNode.appendChild(s);setTimeout(()=>s.style.opacity=.85,30);},5200);
        later(()=>cont('trunk'),7000);
      }
    });
  });
};

/* ===== 7 PHONE ===== */
INIT.phone=function(){
  const P=CONFIG.phone,L=$('#phLog'),R=$('#phRing'),C=$('#phCall');
  set('#phKick',P.kicker);set('#phTtl',P.title);set('#phSub',P.sub);set('#phInc',P.incoming);set('#phMob',P.mobile);
  set('#phName1',CONFIG.mom);set('#phName2',CONFIG.mom);set('#phNoT',P.decline);set('#phYesT',P.accept);
  setImg('#phAv1','now',300,300);setImg('#phAv2','now',300,300);
  const pane=v=>[L,R,C].forEach(x=>x.classList.toggle('on',x===v));
  const list=$('#phList');
  P.missed.forEach((m,i)=>{
    const r=document.createElement('div');r.className='ph-row';
    r.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l6 6M3 9V3h6"/><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4" fill="none"/></svg><div><b></b><small></small></div><span></span>';
    $('b',r).textContent=fill(CONFIG.mom)+(m.n>1?' ('+m.n+')':'');$('small',r).textContent=P.mobile;$('span',r).textContent=m.t;
    list.appendChild(r);show(r,T(500+i*650));
  });
  const note=$('#phNote');note.textContent=fill(P.missedNote);show(note,T(500+P.missed.length*650+500));
  let vib=null,ringing=false;
  function ring(){
    ringing=true;pane(R);Sound.ring(true);haptic([400,200,400]);$('#phDecl').classList.remove('in2');
    clearInterval(vib);vib=setInterval(()=>haptic([400,200,400]),2600);
  }
  function stopRing(){ringing=false;Sound.ring(false);clearInterval(vib);}
  later(ring,500+P.missed.length*650+3200);
  $('#phNo').addEventListener('click',()=>{
    if(!ringing)return;stopRing();const d=$('#phDecl');d.textContent=fill(P.declineNote);d.classList.add('in2');
    later(ring,2600);
  });
  $('#phYes').addEventListener('click',()=>{
    if(!ringing)return;stopRing();pane(C);haptic(30);
    let sec=0;const tm=$('#phTimer');const iv=setInterval(()=>{sec++;tm.textContent='00:'+String(sec%60).padStart(2,'0');},1000);
    const chat=$('#phChat');let i=0;
    function next(){
      if(i>=P.lines.length){
        later(()=>{clearInterval(iv);tm.textContent=fill(P.ended);reveal($('#phAfter'),P.after);cont('phone');},2400);return;
      }
      const b=document.createElement('div');b.className='bub';b.textContent=fill(P.lines[i]);chat.appendChild(b);void b.offsetWidth;b.classList.add('in2');
      chat.scrollTop=chat.scrollHeight;Sound.tick();i++;later(next,2700);
    }
    later(next,900);
  });
};
LEAVE.phone=function(){Sound.ring(false);};

/* ===== 8 DOOR ===== */
INIT.door=function(){
  const D=CONFIG.door;
  set('#drKick',D.kicker);set('#drTtl',D.title);set('#drSub',D.sub);set('#drHint',D.hint);
  const world=$('#drWorld'),night=$('#drNight'),cp=$('#drCap');
  let stage=-1,reached=false;
  const sl=slider($('#drTrack'),$('#drKnob'),$('#drFill'),p=>{
    world.style.transform='scale('+(1-.8*p)+')';world.style.opacity=1-.2*p;night.style.opacity=p;
    let idx=0;D.stages.forEach((s,i)=>{if(p>=s.p)idx=i;});
    const endNow=p>.93;const key=endNow?'end':idx;
    if(key!==stage){stage=key;reveal(cp,endNow?D.end:D.stages[idx].text);if(endNow){cp.style.color='#ffe3a8';}else cp.style.color='';if(p>0){Sound.tick();haptic(10);}}
    if(endNow&&!reached){reached=true;Sound.bell();haptic([60,80,60]);cont('door');}
  });
  sl.set(0);
};

/* ===== 9 BILL ===== */
INIT.bill=function(){
  const B=CONFIG.bill,sc=$('#scene-bill');
  set('#blKick',B.kicker);set('#blTtl',B.title);set('#blSub',B.sub);set('#blHead',B.head);
  set('#blPay',B.payBtn);set('#blSt1',B.stamp);set('#blSt2',B.stampSub);
  const rows=$('#blRows');
  const all=B.items.map(it=>({t:it.t,v:B.rate})).concat([{t:B.totalLabel,v:B.total,tot:1}]);
  all.forEach((it,i)=>{
    const r=document.createElement('div');r.className='bl-row'+(it.tot?' bl-tot':'');
    r.innerHTML='<span></span><em></em>';$('span',r).textContent=fill(it.t);$('em',r).textContent=fill(it.v);
    rows.appendChild(r);show(r,T(700+i*850));
  });
  const pay=$('#blPay');
  setTimeout(()=>pay.classList.add('show'),T(700+all.length*850+500));
  let paid=false;
  pay.addEventListener('click',()=>{
    if(paid)return;paid=true;pay.style.pointerEvents='none';pay.style.opacity=.35;
    const st=$('#blStamp');st.classList.add('slam');Sound.stamp();haptic([50,40,70]);
    later(()=>{reveal($('#blAfter'),B.after);const s=$('.in',sc);s.scrollTo({top:s.scrollHeight,behavior:'smooth'});},1800);
    later(()=>cont('bill'),4200);
  });
};

/* ===== 10 LETTER ===== */
INIT.letter=function(){
  const L=CONFIG.letter,sc=$('#scene-letter'),paper=$('#ltPaper'),body=$('#ltBody');
  set('#ltTo',L.to);set('#ltFrom',L.from);set('#ltHint',L.hint);
  let opened=false,sp=1;
  $('#ltFold').addEventListener('click',()=>{
    if(opened)return;opened=true;sc.classList.add('open');$('#ltHint').style.display='none';Sound.rustle();haptic(20);
    later(()=>write(0),1100);
  });
  paper.addEventListener('click',()=>{sp=.25;});
  function write(i){
    if(i>=L.paragraphs.length){
      const sg=$('#ltSign');sg.textContent=fill(L.sign);sg.classList.add('in2');paper.scrollTo({top:paper.scrollHeight,behavior:'smooth'});
      Sound.bell();haptic([40,60,40]);later(()=>cont('letter'),3200);return;
    }
    const p=document.createElement('p');const words=fill(L.paragraphs[i]).split(' ');
    words.forEach((w,k)=>{const s=document.createElement('span');s.className='w';s.textContent=w;s.style.transitionDelay=(k*T(120)*sp)+'ms';p.appendChild(s);});
    body.appendChild(p);void p.offsetWidth;p.classList.add('on');
    paper.scrollTo({top:paper.scrollHeight,behavior:'smooth'});
    later(()=>write(i+1),(words.length*120+1100)*sp);
  }
};

/* ===== 11 END ===== */
INIT.end=function(){
  const E=CONFIG.end,sc=$('#scene-end'),W=CONFIG.whatsapp;
  set('#enKick',E.kicker);set('#enTtl',E.title);set('#enSub',E.sub);set('#enHint',E.hint);
  set('#enBless',E.blessing);set('#enL1',E.lines[0]);set('#enL2',E.lines[1]);set('#enReplay',E.replay);
  setImg('#enPhoto img','together',500,500);$('#enPhoto figcaption').textContent=fill(CONFIG.photos.together.cap||'');
  const call=$('#enCall');call.textContent=fill(E.callBtn);call.href='tel:'+(CONFIG.momNumber||'');
  $('#enMsg').textContent=fill(E.msgBtn);
  $('#enMsg').addEventListener('click',()=>{
    const num=String(W.number||'').replace(/\D/g,'');
    const url='https://wa.me/'+num+'?text='+encodeURIComponent(W.message);
    window.open(url,'_blank');
  });
  $('#enReplay').addEventListener('click',()=>location.reload());
  let done=false;
  $('#feet').addEventListener('click',e=>{
    if(done)return;done=true;sc.classList.add('blessed');Sound.bell();haptic([30,40,30]);
    const r=sc.getBoundingClientRect(),f=$('#feet').getBoundingClientRect();
    burst(sc,26,'✿',['#f39a1e','#e0661a','#f7c531','#b3201f'],f.left-r.left+f.width/2,f.top-r.top+f.height/2);
    later(()=>show($('#enBless')),700);
    later(()=>show($('#enL1')),3200);
    later(()=>show($('#enL2')),5400);
    later(()=>{show($('#enBtns'));show($('#enReplay'));$('#enBtns').scrollIntoView({behavior:'smooth',block:'nearest'});},7600);
  });
};

go('diya');
})();
